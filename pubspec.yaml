name: ol_champion
description: "A comprehensive G.C.E. O/L Examination study companion app for Sri Lankan students."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Utilities
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0

  # Firebase Suite
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  firebase_storage: ^12.0.1

  # PDF & Networking
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.3
  http: ^1.2.1
  url_launcher: ^6.2.6

  # UI Enhancement & Icons
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sample_pdfs/
